apply plugin: 'com.android.application'

android {
    namespace 'com.mkei.backcast'
    compileSdkVersion 30
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.mkei.backcast"
        // The official OpenAI SDK uses Java 8 APIs (time, streams, Optional and NIO).
        minSdkVersion 26
        targetSdkVersion 26
        multiDexEnabled true
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        // Preserve the upstream notices while merging dependency JAR resources.
        resources {
            merges += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/versions/**']
        }
    }
    lintOptions {
        // This APK is sideloaded and deliberately retains targetSdk 26 behavior.
        disable 'ExpiredTargetSdkVersion'
    }
    testOptions {
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'com.openai:openai-java:4.75.1'
    // App cancellation/deadline hooks use the SDK's public transport APIs directly.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio-jvm:3.6.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

// JVM regressions use the same official SDK dependency graph as the packaged app.
tasks.register('writeAgentTestClasspath') {
    doLast {
        def output = file("$buildDir/agent-test-classpath.txt")
        output.parentFile.mkdirs()
        output.text = configurations.debugRuntimeClasspath.files
                .findAll { it.name.endsWith('.jar') }.collect { it.absolutePath }.join(File.pathSeparator)
    }
}

// Symbol-level source checks use the compiler's resolved Android and SDK graph.
tasks.register('writeProductionAuditClasspath') {
    dependsOn 'processDebugResources'
    doLast {
        def compiler = tasks.named('compileDebugJavaWithJavac').get()
        def entries = compiler.classpath.files as List
        if (compiler.options.bootstrapClasspath != null) {
            entries.addAll(compiler.options.bootstrapClasspath.files)
        }
        def output = file("$buildDir/production-audit-classpath.txt")
        output.parentFile.mkdirs()
        output.text = entries.unique().collect { it.absolutePath }.join(File.pathSeparator)
    }
}
